    function analyzeConjunctionsAndAspects(p) {
      if (!p) return [];
      const results = [];
      const planetsList = ['Sun', 'Moon', 'Mars', 'Mercury', 'Jupiter', 'Venus', 'Saturn', 'Rahu', 'Ketu'];
      const signMap = {};

      planetsList.forEach((k) => {
        if (typeof p[k] !== 'number') return;
        const s = calculateVarga(p[k], 1);
        if (!signMap[s]) signMap[s] = [];
        signMap[s].push(k);
      });

      Object.keys(signMap).forEach((s) => {
        const list = signMap[s];
        if (list.length >= 2) {
          const names = list.map((k) => PLANET_SHORT[k] + ' (' + k + ')').join(' + ');
          let meaning = 'ဂြိုဟ်စွမ်းအင်များ ပေါင်းစပ်လှုပ်ရှားနေသော အနေအထား ဖြစ်သည်။';
          if (list.indexOf('Sun') !== -1 && list.indexOf('Mercury') !== -1) meaning = 'ဗုဒ္ဓါဒိတျ အကျိုးပေးသဖြင့် အသိဉာဏ် ထက်မြက်ပြီး စီမံခန့်ခွဲမှု ထူးချွန်စေမည်။';
          if (list.indexOf('Moon') !== -1 && list.indexOf('Mars') !== -1) meaning = 'စန္ဒြမင်္ဂလာ အကျိုးပေးသဖြင့် စီးပွားဥစ္စာ ရှာဖွေရာတွင် အထူးပေါက်မြောက် အောင်မြင်စေမည်။';
          if (list.indexOf('Jupiter') !== -1 && list.indexOf('Moon') !== -1) meaning = 'ဂဇကေသရီ အကျိုးပေးသဖြင့် ပညာဉာဏ်၊ ဩဇာအာဏာနှင့် ကျော်ကြားမှု ရရှိစေမည်။';
          if (list.indexOf('Venus') !== -1 && list.indexOf('Mercury') !== -1) meaning = 'လက္ခမီနာရာယဏ အကျိုးပေးသဖြင့် အနုပညာ၊ ဉာဏ်ပညာနှင့် စည်းစိမ်ဥစ္စာ ပြည့်စုံစေမည်။';
          results.push({
            type: 'ဂြိုဟ်ပူးယှဉ်ခြင်း (Conjunction)',
            title: names + ' [' + RASI_NAMES_EN[s] + ' အိမ်တွင် ပူးယှဉ်ခြင်း]',
            desc: meaning
          });
        }
      });

      for (let i = 0; i < planetsList.length; i++) {
        for (let j = i + 1; j < planetsList.length; j++) {
          const p1 = planetsList[i], p2 = planetsList[j];
          if (typeof p[p1] !== 'number' || typeof p[p2] !== 'number') continue;
          const s1 = calculateVarga(p[p1], 1), s2 = calculateVarga(p[p2], 1);
          if (Math.abs(s1 - s2) === 6) {
            results.push({
              type: 'သတ္တမ အပြန်အလှန်အမြင် (Mutual Aspect - 7th)',
              title: p1 + ' နှင့် ' + p2 + ' မျက်နှာချင်းဆိုင် မြင်နေခြင်း',
              desc: 'ဂြိုဟ်နှစ်လုံး အပြန်အလှန် အားပြိုင်သဟဇာတဖြစ်ကာ ဘဝကဏ္ဍနှစ်ခုကို တပြိုင်နက် ဟန်ချက်ညီအောင် လှုံ့ဆော်ပေးနေသည်။'
            });
          }
        }
      }

      if (typeof p.Jupiter === 'number') {
        const jSign = calculateVarga(p.Jupiter, 1);
        const jAsp5 = (jSign + 4) % 12, jAsp9 = (jSign + 8) % 12;
        planetsList.forEach((k) => {
          if (k === 'Jupiter' || typeof p[k] !== 'number') return;
          const s = calculateVarga(p[k], 1);
          if (s === jAsp5 || s === jAsp9) {
            results.push({
              type: 'ဂုရု အထူးအမြင် (Jupiter Benefic Aspect)',
              title: 'ကြာသပတေးက ' + k + ' ဂြိုဟ်ကို သောမအမြင်ဖြင့် မြင်ခြင်း',
              desc: k + ' ၏ အကျိုးပေးစွမ်းရည်ကို ပိုမိုမြင့်မားစေပြီး အခက်အခဲများကို ပြေပျောက်စေသော အထောက်အပံ့ ရရှိသည်။'
            });
          }
        });
      }

      return results;

    function analyzeLiveTransit(birthPlanets, transitPlanets) {
      if (!birthPlanets || !transitPlanets || typeof birthPlanets.Moon !== 'number') {
        return { sadeSati: '', jupTransit: '', rahuTransit: '' };
      }
      const natalMoonSign = calculateVarga(birthPlanets.Moon, 1);
      const transitSaturnSign = calculateVarga(transitPlanets.Saturn, 1);
      const transitJupiterSign = calculateVarga(transitPlanets.Jupiter, 1);

    function generateAnnualForecast(birthDate, birthPlanets, transitPlanets) {
      const now = new Date();
      const bMonth = (birthDate && !isNaN(birthDate.getTime())) ? birthDate.getMonth() : now.getMonth();
      const bDay = (birthDate && !isNaN(birthDate.getTime())) ? birthDate.getDate() : now.getDate();

      let startYear = now.getFullYear();
      const currentBdayThisYear = new Date(startYear, bMonth, bDay);
      if (now < currentBdayThisYear) {
        startYear -= 1;
      }
      const endYear = startYear + 1;

      const monthsData = [];
      const myanmarMonthNames = ['ဇန်နဝါရီ', 'ဖေဖော်ဝါရီ', 'မတ်', 'ဧပြီ', 'မေ', 'ဇွန်', 'ဇူလိုင်', 'သြဂုတ်', 'စက်တင်ဘာ', 'အောက်တိုဘာ', 'နိုဝင်ဘာ', 'ဒီဇင်ဘာ'];

      for (let i = 0; i < 12; i++) {
        const mIdx = (bMonth + i) % 12;
        const yr = (bMonth + i >= 12) ? endYear : startYear;

        let theme = 'တည်ငြိမ်တိုးတက်သော ကာလ';

        if ([0, 4, 9].indexOf(i) !== -1) {
          theme = 'စီးပွားငွေကြေးနှင့် အလုပ်အကိုင် အခွင့်အလမ်းသစ်များ ပွင့်လန်းမည့် အထူးကောင်းမွန်သောလ။';
          badge = 'အထူးကောင်း';

          badgeColor = 'bg-amber-100 text-amber-800 font-bold';

          badge = 'အဆင်ပြေ';
          badgeColor = 'bg-slate-100 text-slate-700';
        }

        monthsData.push({
          num: i + 1,
          monthName: `${myanmarMonthNames[mIdx]} (${yr})`,

          theme,

        });

      return {
        annualCycle: `${bDay} ${myanmarMonthNames[bMonth]} ${startYear} မှ ${bDay} ${myanmarMonthNames[bMonth]} ${endYear} အထိ (၁ နှစ်စာ)`,

    function calculateSynastry(bPlanets, gPlanets) {
      const bMoon = bPlanets ? bPlanets.Moon : 0;
      const gMoon = gPlanets ? gPlanets.Moon : 0;
      const bNak = Math.floor(norm360(bMoon) / (360 / 27));
      const gNak = Math.floor(norm360(gMoon) / (360 / 27));
      const bSign = Math.floor(norm360(bMoon) / 30);
      const gSign = Math.floor(norm360(gMoon) / 30);
      const varna = (bSign % 4 >= gSign % 4) ? 1 : 0;
      const vashya = (bSign === gSign || Math.abs(bSign - gSign) === 6) ? 2 : 1;
      const diffNak = (gNak - bNak + 27) % 27;
      const tara = ([2, 4, 6, 8].indexOf(diffNak % 9) !== -1) ? 3 : 1.5;
      const yoni = ((bNak % 14) === (gNak % 14)) ? 4 : 2;
      const maitri = (bSign === gSign || (bSign + gSign) % 2 === 0) ? 5 : 3;
      const gana = (bNak % 3 === gNak % 3) ? 6 : (bNak % 3 === 2 && gNak % 3 === 0 ? 0 : 3);
      const bhakoot = ([1, 7, 3, 11, 4, 10].indexOf((gSign - bSign + 12) % 12 + 1) !== -1) ? 7 : 0;
      const nadi = (bNak % 3 !== gNak % 3) ? 8 : 0;
      const total = varna + vashya + tara + yoni + maitri + gana + bhakoot + nadi;

      const attractionPct = Math.min(98, Math.max(48, Math.floor(60 + yoni * 6 + vashya * 5)));
      const lovePct = Math.min(96, Math.max(45, Math.floor((maitri / 5) * 45 + (bhakoot / 7) * 35 + 15)));
      const dashaRelPct = Math.min(95, Math.max(50, Math.floor(55 + (gana / 6) * 20 + (vashya / 2) * 20)));
      const sexualPct = Math.min(98, Math.max(40, Math.floor((yoni / 4) * 60 + (vashya / 2) * 20 + 15)));

      const curY = new Date().getFullYear();
      return {
        total,
        verdict: total >= 18 ? 'လက်ထပ်ထိမ်းမြားရန် သင့်တော်ပါသည် (Compatible)' : 'သတိပြုဆင်ခြင်သင့်ပါသည် (Low Compatibility)',
        attractionPct,
        lovePct,
        dashaRelPct,
        sexualPct,
        datingTiming: `${curY} - ${curY + 2} ခုနှစ်အတွင်း`,
        intimacyTiming: `${curY + 1} - ${curY + 3} ခုနှစ်အတွင်း`,
        marriageTiming: total >= 18 ? `${curY + 2} - ${curY + 5} ခုနှစ်အတွင်း` : `${curY + 3} ခုနှစ်နောက်ပိုင်း`,
        karmicBond: total >= 25 ? 'ရှေးရေစက် အလွန်ထူးခြားစွာ ပါရှိသည် (လက်တွဲမြဲမည့် အိမ်ထောင်ဖက်)' : (total >= 18 ? 'ရေစက်အလယ်အလတ် ပါရှိသည် (အပြန်အလှန် ညှိနှိုင်းမှုဖြင့် အောင်မြင်မည်)' : 'ရှေးရေစက် အားနည်းသည် (သတိပြုဆင်ခြင်သင့်)'),
        breakdown: [
          { k: 'Varna (ဝဏ္ဏ)', score: varna, max: 1, desc: 'အလုပ်အကိုင်၊ စရိုက်အဆင့်အတန်း လိုက်ဖက်မှု' },
          { k: 'Vashya (ဝသျှ)', score: vashya, max: 2, desc: 'အပြန်အလှန် ဆွဲဆောင်ထိန်းကျောင်းနိုင်မှု' },
          { k: 'Tara (တာရာ)', score: tara, max: 3, desc: 'ကံကြမ္မာ၊ အသက်ရှည်မှုနှင့် ကျန်းမာရေး' },
          { k: 'Yoni (ယောနိ)', score: yoni, max: 4, desc: 'သဘာဝဓာတ်၊ လိင်ပိုင်းဆိုင်ရာ လိုက်ဖက်မှု' },
          { k: 'Graha Maitri (ဂြိုဟ်မိတ်)', score: maitri, max: 5, desc: 'စိတ်ပိုင်းဆိုင်ရာ ချစ်ခင်ကြင်နာမှု' },
          { k: 'Gana (ဂဏ)', score: gana, max: 6, desc: 'ဗီဇစရိုက် (ဒေဝ၊ မနုဿ၊ ရက္ခိုသ်)' },
          { k: 'Bhakoot (ဘကုတ)', score: bhakoot, max: 7, desc: 'အိမ်ထောင်ရေး ကြီးပွားချမ်းသာမှု' },
          { k: 'Nadi (နာဒီ)', score: nadi, max: 8, desc: 'မျိုးရိုးဗီဇနှင့် ကျန်းမာရေးဓာတ် သဟဇာတ' }
        ]
      };
    }

    function detectPrashnaIntent(text) {
      const t = (text || '').toLowerCase();
      if (/စာမေးပွဲ|ပညာ|ကျောင်း|ဘွဲ့|အောင်|စာသင်|စာမေး/.test(t)) return 'exam';
      if (/အလုပ်|ရာထူး|ကုမ္ပဏီ|အင်တာဗျူး|လုပ်ငန်း|လစာ|ရာထူးတိုး/.test(t)) return 'career';
      if (/နိုင်ငံခြား|ဗီဇာ|ခရီး|သံရုံး|လေယာဉ်|passport|oversea/.test(t)) return 'travel';
      if (/ချစ်|ရည်းစား|အိမ်ထောင်|မင်္ဂလာ|လက်ထပ်|မေတ္တာ|ပေါင်းရ/.test(t)) return 'love';
      if (/ငွေ|အကြွေး|လာဘ်|အရောင်း|အမြတ်|စီးပွား|ကြွေး/.test(t)) return 'wealth';
      if (/ကျန်းမာ|ရောဂါ|ဆေး|ခွဲစိတ်|ဖျား|နာ|အနာ/.test(t)) return 'health';
      if (/အိမ်|ခြံ|မြေ|ကား|တိုက်|ဆိုင်|ပိုင်ဆိုင်/.test(t)) return 'property';
      return 'general';
    }

      const intent = detectPrashnaIntent(queryText);

      const tMoonSign = calculateVarga(transitPlanets ? transitPlanets.Moon : 0, 1);
      const tJupSign = calculateVarga(transitPlanets ? transitPlanets.Jupiter : 0, 1);
      const bMoonSign = calculateVarga(birthPlanets ? birthPlanets.Moon : 0, 1);
      const bLagnaSign = calculateVarga(birthPlanets ? birthPlanets.Lagna : 0, 1);

      const queryConfigs = {

      const n = parseInt(val, 10);

      const n = parseInt(val, 10);
      if (isNaN(n) || n < 1 || n > 31) return fallback;

      const n = parseInt(val, 10);
      if (isNaN(n) || n < 1 || n > 12) return fallback;
      return n;

    const NorthChart = ({ planets, transitPlanets, isOverlay, vargaNum, size = 320 }) => {
      const h = size / 2;
      const lagnaSign = calculateVarga(planets ? planets.Lagna : 0, vargaNum);
      const natalByHouse = [[], [], [], [], [], [], [], [], [], [], [], []];
      const transitByHouse = [[], [], [], [], [], [], [], [], [], [], [], []];
      if (planets) {
        Object.keys(planets).forEach((k) => {
          if (k !== 'ayanamsaVal') {
            const house = (calculateVarga(planets[k], vargaNum) - lagnaSign + 12) % 12;
            safeAdd(natalByHouse, house, PLANET_SHORT[k] + ' ' + Math.floor(norm360(planets[k]) % 30) + '°');
          }
        });
      }
      if (isOverlay && transitPlanets) {
        Object.keys(transitPlanets).forEach((k) => {
          if (k !== 'ayanamsaVal') {
            const house = (calculateVarga(transitPlanets[k], 1) - lagnaSign + 12) % 12;
            safeAdd(transitByHouse, house, PLANET_SHORT[k]);
          }
        });
      }
      const hCenters = [{ x: h, y: h * 0.45 }, { x: h * 0.5, y: h * 0.22 }, { x: h * 0.22, y: h * 0.5 }, { x: h * 0.45, y: h }, { x: h * 0.22, y: h * 1.5 }, { x: h * 0.5, y: h * 1.78 }, { x: h, y: h * 1.55 }, { x: h * 1.5, y: h * 1.78 }, { x: h * 1.78, y: h * 1.5 }, { x: h * 1.55, y: h }, { x: h * 1.78, y: h * 0.5 }, { x: h * 1.5, y: h * 0.22 }];

      return (
        <svg width={size} height={size} className="mx-auto bg-[#FFFDF9] rounded border border-blue-900 shadow">
          <rect x="0" y="0" width={size} height={size} stroke="#1E3A8A" strokeWidth="2" fill="#FFFDF9" />

          <line x1={0} y1={size} x2={size} y2={0} stroke="#1E3A8A" strokeWidth="1.5" />
          <polygon points={`${h},0 ${size},${h} ${h},${size} 0,${h}`} stroke="#1E3A8A" strokeWidth="1.5" fill="none" />
          {hCenters.map((c, hIdx) => {
            const natalList = natalByHouse[hIdx] || [];
            const transitList = transitByHouse[hIdx] || [];

                  <text x={c.x} y={c.y + 1} fontSize="7.5" fontWeight="bold" fill="#DC2626" textAnchor="middle">[{transitList.join(',')}]</text>

                  <text key={idx} x={c.x} y={c.y + (isOverlay ? 11 : 3) + idx * 9} fontSize="8.5" fontWeight={str.indexOf('As') === 0 ? 'bold' : 'normal'} fill={str.indexOf('As') === 0 ? '#DC2626' : '#1E293B'} textAnchor="middle">{str}</text>
                ))}

    function safeYear(val, fallback) {
      const n = parseInt(val, 10);
      if (isNaN(n) || n < 1900 || n > 2100) return fallback;
      return n;
    }
    function safeMonth(val, fallback) {
      const n = parseInt(val, 10);
      if (isNaN(n) || n < 1 || n > 12) return fallback;
      return n;
    }
    function safeDay(val, fallback) {
      const n = parseInt(val, 10);
      if (isNaN(n) || n < 1 || n > 31) return fallback;
      return n;
    }
    function safeHour(val, fallback) {
      const n = parseInt(val, 10);
      if (isNaN(n) || n < 1 || n > 12) return fallback;
      return n;
    }
    function safeMinute(val, fallback) {
      const n = parseInt(val, 10);
      if (isNaN(n) || n < 0 || n > 59) return fallback;
      return n;
    }

      const lifeOverview = generateLifeOverview(birthPlanets);

      const annualForecast = generateAnnualForecast(birthDateObj, birthPlanets, transitPlanets);

      const boyH = to24(safeHour(boy.h, 12), boy.ampm);

      const boyJD = getJulianDay(safeYear(boy.y, curY), safeMonth(boy.m, 1), safeDay(boy.d, 1), boyH, safeMinute(boy.min, 0), 6.5);

              <h2 className="font-bold text-emerald-900 text-sm mb-1">ပါဝင်သော ယောဂများ ({yogas.length})</h2>
              {yogas.map((y, idx) => (
                <div key={idx} className="bg-white border border-emerald-200 p-2.5 rounded">
                  <div className="font-bold text-emerald-800 text-[13px]">{y.name}</div>
                  <div className="text-slate-600 mt-0.5"><strong>နက္ခတ်အကြောင်းရင်း:</strong> {y.cause}</div>
                  <div className="text-emerald-700 mt-0.5"><strong>ပေးအပ်မည့် အကျိုး:</strong> {y.result}</div>
                </div>
              ))}
            </div>
          )}

          {/* TAB 8: MATCHING */}
          {activeTab === 'matching' && (
            <div className="p-3 space-y-3 text-xs">
              <h2 className="font-bold text-emerald-900 text-sm">ဇာတာတိုက်စစ် & ဖြစ်နိုင်ခြေဆန်းစစ်ချက်</h2>

              {/* Boy Input */}
              <div className="bg-white border border-slate-200 p-2.5 rounded space-y-1.5">
                <span className="font-bold text-emerald-800">သတို့သား အချက်အလက် (Boy)</span>
                <input value={boy.name} onChange={(e) => setBoy({ ...boy, name: e.target.value })} placeholder="အမည်" className="w-full border p-1 rounded text-xs" />
                <div className="grid grid-cols-6 gap-1">
                  <input value={boy.d} onChange={(e) => setBoy({ ...boy, d: e.target.value })} placeholder="ရက်" className="border p-1 rounded text-center" />
                  <input value={boy.m} onChange={(e) => setBoy({ ...boy, m: e.target.value })} placeholder="လ" className="border p-1 rounded text-center" />
                  <input value={boy.y} onChange={(e) => setBoy({ ...boy, y: e.target.value })} placeholder="ခုနှစ်" className="border p-1 rounded text-center" />
                  <input value={boy.h} onChange={(e) => setBoy({ ...boy, h: e.target.value })} placeholder="နာရီ" className="border p-1 rounded text-center" />
                  <input value={boy.min} onChange={(e) => setBoy({ ...boy, min: e.target.value })} placeholder="မိနစ်" className="border p-1 rounded text-center" />
                  <button onClick={() => setBoy({ ...boy, ampm: boy.ampm === 'AM' ? 'PM' : 'AM' })} className="bg-emerald-800 text-white rounded font-bold">{boy.ampm}</button>
                </div>
                <div className="flex space-x-1 pt-1">
                  <input value={boy.city} onChange={(e) => setBoy({ ...boy, city: e.target.value })} placeholder="မွေးဖွားရာ မြို့၊ နိုင်ငံ..." className="flex-1 border p-1 rounded text-xs" />
                  <button onClick={() => handleSearchCity(boy.city, 'boy')} className="bg-emerald-800 text-white px-2.5 py-1 rounded text-xs font-semibold">ရှာမည်</button>
                </div>
                {citySuggestions.length > 0 && searchTarget === 'boy' && (
                  <div className="bg-white border border-slate-300 rounded shadow-md text-xs">
                    {citySuggestions.map((it, idx) => (
                      <div key={idx} onClick={() => selectCity(it)} className="p-1.5 border-b last:border-0 hover:bg-slate-100 cursor-pointer">{it.display_name}</div>
                    ))}
                  </div>
                )}
              </div>

              {/* Girl Input */}
              <div className="bg-white border border-slate-200 p-2.5 rounded space-y-1.5">
                <span className="font-bold text-emerald-800">သတို့သမီး အချက်အလက် (Girl)</span>
                <input value={girl.name} onChange={(e) => setGirl({ ...girl, name: e.target.value })} placeholder="အမည်" className="w-full border p-1 rounded text-xs" />
                <div className="grid grid-cols-6 gap-1">
                  <input value={girl.d} onChange={(e) => setGirl({ ...girl, d: e.target.value })} placeholder="ရက်" className="border p-1 rounded text-center" />
                  <input value={girl.m} onChange={(e) => setGirl({ ...girl, m: e.target.value })} placeholder="လ" className="border p-1 rounded text-center" />
                  <input value={girl.y} onChange={(e) => setGirl({ ...girl, y: e.target.value })} placeholder="ခုနှစ်" className="border p-1 rounded text-center" />
                  <input value={girl.h} onChange={(e) => setGirl({ ...girl, h: e.target.value })} placeholder="နာရီ" className="border p-1 rounded text-center" />
                  <input value={girl.min} onChange={(e) => setGirl({ ...girl, min: e.target.value })} placeholder="မိနစ်" className="border p-1 rounded text-center" />
                  <button onClick={() => setGirl({ ...girl, ampm: girl.ampm === 'AM' ? 'PM' : 'AM' })} className="bg-emerald-800 text-white rounded font-bold">{girl.ampm}</button>
                </div>
                <div className="flex space-x-1 pt-1">
                  <input value={girl.city} onChange={(e) => setGirl({ ...girl, city: e.target.value })} placeholder="မွေးဖွားရာ မြို့၊ နိုင်ငံ..." className="flex-1 border p-1 rounded text-xs" />
                  <button onClick={() => handleSearchCity(girl.city, 'girl')} className="bg-emerald-800 text-white px-2.5 py-1 rounded text-xs font-semibold">ရှာမည်</button>
                </div>
                {citySuggestions.length > 0 && searchTarget === 'girl' && (
                  <div className="bg-white border border-slate-300 rounded shadow-md text-xs">
                    {citySuggestions.map((it, idx) => (
                      <div key={idx} onClick={() => selectCity(it)} className="p-1.5 border-b last:border-0 hover:bg-slate-100 cursor-pointer">{it.display_name}</div>
                    ))}
                  </div>
                )}
              </div>

              {/* Total Score */}
              <div className="bg-amber-100/70 border border-amber-300 p-3 rounded text-center">
                <div className="text-xl font-bold text-amber-900">{matchResult.total} / ၃၆ မှတ်</div>
                <div className="font-semibold text-amber-800 text-xs mt-0.5">{matchResult.verdict}</div>
              </div>

              {/* Deep Synastry Metrics */}
              <div className="bg-white border border-amber-200 p-3 rounded space-y-1.5">
                <h3 className="font-bold text-emerald-900 text-xs border-b pb-1">နှစ်ဦးကြား သံယောဇဉ်နှင့် ဖြစ်နိုင်ခြေ ရာခိုင်နှုန်းဆန်းစစ်ချက်</h3>
                <div className="flex justify-between py-0.5 border-b border-slate-100">
                  <span className="text-slate-700">✨ အပြန်အလှန် ဆွဲဆောင်မှုရှိနိုင်ခြေ:</span>
                  <span className="font-bold text-emerald-800">{matchResult.attractionPct}%</span>
                </div>
                <div className="flex justify-between py-0.5 border-b border-slate-100">
                  <span className="text-slate-700">❤️ တစ်ဦးပေါ်တစ်ဦး အချစ်စိတ် ဖြစ်ပေါ်နိုင်ခြေ:</span>
                  <span className="font-bold text-emerald-800">{matchResult.lovePct}%</span>
                </div>
                <div className="flex justify-between py-0.5 border-b border-slate-100">
                  <span className="text-slate-700">👩‍❤️‍👨 ဒသာအရ သမီးရည်းစား ဖြစ်နိုင်ခြေ:</span>
                  <span className="font-bold text-emerald-800">{matchResult.dashaRelPct}% ({matchResult.datingTiming})</span>
                </div>
                <div className="flex justify-between py-0.5 border-b border-slate-100">
                  <span className="text-slate-700">🔥 သံဝါသ လိင်ဆက်ဆံနိုင်ခြေ:</span>
                  <span className="font-bold text-emerald-800">{matchResult.sexualPct}% ({matchResult.intimacyTiming})</span>
                </div>
                <div className="py-0.5 text-slate-700">
                  💍 <strong>မင်္ဂလာဆောင်ရန် အကောင်းဆုံး:</strong> <span className="text-amber-800 font-semibold">{matchResult.marriageTiming}</span>
                </div>
                <div className="py-0.5 text-slate-700">
                  ✨ <strong>ရေစက်အထောက်အပံ့:</strong> <span className="text-emerald-800 font-semibold">{matchResult.karmicBond}</span>
                </div>
              </div>

              {/* 36 Points Table Breakdown */}
              <div className="bg-white rounded border border-slate-200 overflow-hidden text-xs">
                <div className="bg-slate-100 p-2 font-bold text-slate-700 border-b border-slate-200">အဋ္ဌကုတ (၃၆) မှတ် အသေးစိတ် ခွဲခြမ်းစိတ်ဖြာချက်</div>
                {matchResult.breakdown.map((b, idx) => (
                  <div key={idx} className="flex justify-between items-center p-2 border-b last:border-0 border-slate-100">
                    <div className="flex-1 pr-2">
                      <div className="font-bold text-slate-800">{b.k}</div>
                      <div className="text-[10px] text-slate-500">{b.desc}</div>
                    </div>
                    <div className="font-bold text-amber-800 whitespace-nowrap">{b.score} / {b.max}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* FULLSCREEN MODAL */}
          <FullscreenChartModal
            isOpen={showFullscreenChart}
            onClose={() => setShowFullscreenChart(false)}
            chartType={chartStyle}
            planets={activeTab === 'transit' ? transitPlanets : birthPlanets}
            transitPlanets={transitPlanets}
            isOverlay={activeTab === 'chart' && isOverlayOn}
            vargaNum={varga}
            birthInfo={{ name: birthName, date: `${sD}.${sM}.${sY}`, time: `${birthHour}:${birthMinute} ${birthAmPm}`, city: birthPlace }}
            transitInfo={{ date: `${now.getDate()}.${now.getMonth()+1}.${now.getFullYear()}`, time: `${now.getHours()}:${now.getMinutes()}`, city: transitCity }}
          />

          {/* SAVED PROFILES MODAL */}
          {showSavedModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg p-4 w-full max-w-xs text-xs space-y-2">
                <h3 className="font-bold text-sm text-slate-800">သိမ်းဆည်းထားသော ဇာတာရှင်များ</h3>
                <div className="max-h-60 overflow-y-auto space-y-1">
                  {savedProfiles.length === 0 ? <p className="text-slate-500">မှတ်တမ်းမရှိသေးပါ။</p> : savedProfiles.map((p) => (
                    <div key={p.id} className="flex justify-between items-center border-b py-1.5">
                      <div onClick={() => loadProfile(p)} className="cursor-pointer">
                        <div className="font-bold text-emerald-900">{p.name}</div>
                        <div className="text-[10px] text-slate-500">{p.day}/{p.month}/{p.year} {p.hour}:{p.minute} {p.ampm}</div>
                      </div>
                      <button onClick={() => deleteProfile(p.id)} className="bg-red-600 text-white px-2 py-1 rounded text-[10px]">ဖျက်</button>
                    </div>
                  ))}
                </div>
                <button onClick={() => setShowSavedModal(false)} className="w-full bg-slate-700 text-white py-1.5 rounded font-bold mt-2">ပိတ်မည်</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function RootApp() {
      return (
        <ErrorBoundary>
          <MainApp />
        </ErrorBoundary>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RootApp />);
  </script>
</body>
</html>
